# Single-model rerun of the multi-view GBDT (the overnight run was suspended).
# Same params as configs/gbdt.yaml::gbdt_multiview_svd256 for comparability.
seed: 42

cv:
  n_splits: 5
  shuffle: true
  method: auto

models:
  - name: gbdt_multiview_svd256
    features: [char, word]
    style: true
    svd: 256
    classifier: gbdt
    class_weight: balanced
    max_features: 100000
    min_df: 2
    char_ngram_range: [2, 5]
    word_ngram_range: [1, 2]
    max_iter: 300
    learning_rate: 0.05
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 1.0