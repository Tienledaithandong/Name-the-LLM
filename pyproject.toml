[project]
name = "name-that-llm"
version = "0.1.0"
description = "CPU-first 18-class LLM attribution for the Kaggle Name That LLM competition"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gpu = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2", "sentence-transformers>=3.0"]
boosting = ["lightgbm>=4.0", "catboost>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
